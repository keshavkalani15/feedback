{% extends "admin/base.html" %}
{% block content %}
    <h2 class="page-title">Manage Teachers</h2>
    
    <div style="display: flex; gap: 20px; margin-bottom: 25px;">
        
        <div class="card" style="flex: 2; margin-bottom: 0;">
            <h3 class="card-title">Add Single Teacher</h3>
            <form action="{{ url_for('admin.add_teacher') }}" method="POST" class="form-grid" style="grid-template-columns: 1fr 2fr auto;">
                <div class="form-group">
                    <label>Emp ID</label>
                    <input type="text" name="prn" placeholder="Emp ID" required>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Full Name" required>
                </div>
                <button class="btn btn-blue" style="height: 39px; margin-bottom: 10px;">Add</button>
            </form>
        </div>

        <div class="card" style="flex: 1; margin-bottom: 0; border-left: 4px solid var(--soft-blue);">
            <h3 class="card-title">📂 Bulk Upload (CSV)</h3>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span style="font-size: 0.85rem; color: #666;">Upload your faculty list here.</span>
                <a href="{{ url_for('admin.download_sample', file_type='teachers') }}" style="font-size: 0.8rem; background: #f8fafc; color: #0284c7; padding: 4px 10px; border-radius: 4px; text-decoration: none; border: 1px solid #bae6fd; font-weight: 600;">📥 Sample CSV</a>
            </div>
            <form action="{{ url_for('admin.upload_teachers_csv') }}" method="POST" enctype="multipart/form-data" style="display: flex; gap: 10px; align-items: center;">
                <input type="file" name="file" accept=".csv" required style="padding: 5px; font-size: 0.9rem;">
                <button class="btn btn-blue btn-sm" style="height: 34px; margin-bottom: 10px;">Upload</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 class="card-title">Teacher Directory</h3>
            <input type="text" id="searchTeacher" placeholder="Search Name or ID..." style="width: 400px; padding: 6px;">
        </div>

        <table class="paginated-table" data-search-id="searchTeacher" data-pagination-id="pagiTeacher">
            <thead>
                <tr>
                    <th style="width: 20%;">Emp ID</th>
                    <th style="width: 50%;">Name</th>
                    <th style="width: 30%;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for t in teachers %}
                <tr>
                    <td>{{ t.prn_empID }}</td>
                    <td style="font-weight: 600;">{{ t.name }}</td>
                    <td class="action-btn-group">
                        <a href="{{ url_for('admin.edit_teacher', user_id=t.userID) }}" class="btn btn-blue btn-sm">Edit</a>
                        <form action="{{ url_for('admin.delete_teacher', user_id=t.userID) }}" method="POST" onsubmit="return confirm('Delete this teacher?');">
                            <button class="btn btn-red btn-sm">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <div id="pagiTeacher" style="margin-top: 15px; text-align: right;"></div>
    </div>
{% endblock %}
