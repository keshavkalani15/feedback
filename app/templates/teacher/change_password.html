{% extends "teacher/base.html" %}

{% block content %}
<style>
    /* Styles copied from Student Portal for exact match */
    .split-container {
        background: #ffffff; 
        border-radius: 8px;
        padding: 25px; 
        border: 1px solid #e0e6ed;
        display: flex; 
        flex-direction: column;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    
    .section-title {
        color: #34495e; 
        font-size: 1.1rem;
        font-weight: 600; 
        margin-bottom: 20px;
        padding-bottom: 15px; 
        border-bottom: 1px solid #e0e6ed;
    }

    .form-input {
        width: 100%; 
        padding: 12px; 
        margin: 8px 0 20px 0;
        border: 1px solid #e0e6ed; 
        border-radius: 6px; 
        background: #fcfcfc;
        transition: 0.2s;
    }
    .form-input:focus {
        border-color: #5dade2;
        background: #fff;
        outline: none;
    }

    .btn-blue {
        background: #5dade2; 
        color: white;
        padding: 10px 20px; 
        border: none; 
        border-radius: 6px;
        cursor: pointer; 
        font-weight: 600; 
        font-size: 0.9rem; 
        transition: 0.2s;
    }
    .btn-blue:hover { background: #4a9ecf; }
    
    /* Error text style */
    small { font-size: 0.85rem; display: block; margin-top: -15px; margin-bottom: 15px; }
</style>

<h2 class="page-title" style="text-align: center; font-weight: bold;">Security Settings</h2>

<div class="split-container" style="max-width: 500px; margin: 0 auto;">
    <div class="section-title">Update Password</div>
    
    <form action="{{ url_for('auth.change_password') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        
        <label>Current Password</label>
        <input type="password" name="current_password" id="currentPass" class="form-input" required onkeyup="validatePassword()" />

        <label>New Password</label>
        <input type="password" name="new_password" id="newPass" class="form-input" required onkeyup="validatePassword()" />
        <small id="newPassError" style="color: #e74c3c; display: none;">New password cannot be the same as current.</small>

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" id="confirmPass" class="form-input" required onkeyup="validatePassword()" />
        <small id="confirmPassError" style="color: #e74c3c; display: none;">Passwords do not match.</small>

        <button type="submit" id="updateBtn" class="btn btn-blue" style="width: 100%; margin-top: 10px; opacity: 0.6; cursor: not-allowed;" disabled>Update</button>
    </form>
</div>

<script>
    function validatePassword() {
        const current = document.getElementById('currentPass').value;
        const newP = document.getElementById('newPass').value;
        const confirmP = document.getElementById('confirmPass').value;
        const btn = document.getElementById('updateBtn');
        const newError = document.getElementById('newPassError');
        const confirmError = document.getElementById('confirmPassError');
        
        let isValid = true;

        // 1. Check New vs Current
        if (current && newP && current === newP) {
            newError.style.display = 'block'; isValid = false;
        } else { newError.style.display = 'none'; }

        // 2. Check Confirm vs New
        if (newP && confirmP && newP !== confirmP) {
            confirmError.style.display = 'block'; isValid = false;
        } else { confirmError.style.display = 'none'; }

        // 3. Final Validation
        if (isValid && current && newP && confirmP) {
            btn.disabled = false; btn.style.opacity = "1"; btn.style.cursor = "pointer";
        } else {
            btn.disabled = true; btn.style.opacity = "0.6"; btn.style.cursor = "not-allowed";
        }
    }
</script>
{% endblock %}
