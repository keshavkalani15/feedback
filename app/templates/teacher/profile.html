{% extends "teacher/base.html" %}
{% block content %}
    <h2 class="page-title">My Profile</h2>

    <div class="card" style="max-width: 600px;">
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
            <div style="width: 80px; height: 80px; background: var(--soft-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; font-weight: bold;">
                {{ user.name[0] }}
            </div>
            <div>
                <h2 style="margin: 0; color: var(--primary-slate);">{{ user.name }}</h2>
                <p style="color: #7f8c8d;">Teacher</p>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" value="{{ user.prn_empID }}" disabled style="background: #f9f9f9; cursor: not-allowed;">
            </div>
            <div class="form-group">
                <label>Role</label>
                <input type="text" value="Faculty Member" disabled style="background: #f9f9f9; cursor: not-allowed;">
            </div>
        </div>
        
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;">
            <p style="font-size: 0.9rem; color: #666;">
                Need to update your details? Please contact the <strong>System Administrator</strong>.
            </p>
        </div>
    </div>
{% endblock %}
